<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Editar clase')}"></head>

<body class="centered">
    <div class="container container-wide">
        <a th:href="@{/admin/clases}" class="back-link">← Volver a clases</a>
        <h2>Editar clase</h2>

        <div th:replace="~{fragments :: alertas}"></div>

        <form th:action="@{/admin/clase/editar/{id}(id=${clase.idClase})}" method="post" th:object="${clase}">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre *</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required>
                </div>
                <div class="form-group">
                    <label for="capacidad">Capacidad *</label>
                    <input type="number" id="capacidad" th:field="*{capacidad}" min="1" required>
                </div>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción *</label>
                <textarea id="descripcion" th:field="*{descripcion}" required></textarea>
            </div>

            <div class="form-group">
                <label for="idEntrenador">Entrenador *</label>
                <select id="idEntrenador" name="idEntrenador" required>
                    <option value="">Seleccione un entrenador</option>
                    <option th:each="e : ${entrenadores}" th:value="${e.idEntrenador}"
                        th:selected="${clase.entrenador != null and e.idEntrenador == clase.entrenador.idEntrenador}"
                        th:text="${e.nombre}">
                    </option>
                </select>
            </div>

            <div th:replace="~{fragments :: campos-horario(${clase})}"></div>

            <p class="info-note mb-20" th:text="${clase.inscritos} + ' cliente(s) inscrito(s)'">0 inscritos</p>
            <button type="submit" class="btn btn-primary btn-block">Guardar cambios</button>
        </form>
    </div>
</body>

</html>
