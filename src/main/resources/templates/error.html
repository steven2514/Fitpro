<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPro - Error</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page">
    <header class="site-header">
        <a th:href="@{/}" class="brand"><span class="brand-mark">F</span>FitPro</a>
    </header>

    <main class="auth-main">
        <div class="auth-card text-center">
            <div class="error-code" th:text="${statusCode ?: (status ?: 500)}">500</div>
            <h1>Algo salió mal</h1>
            <p class="lead" th:text="${error} ?: 'Ocurrió un error inesperado en el servidor.'">
                Ocurrió un error inesperado en el servidor.
            </p>

            <div th:if="${details}" class="error-details">
                <div th:each="detalle : ${details}">
                    <strong th:text="${detalle.field}"></strong>: <span th:text="${detalle.defaultMessage}"></span>
                </div>
            </div>

            <a th:href="@{/}" class="btn btn-primary btn-block">Volver al inicio</a>
        </div>
    </main>
</body>

</html>
