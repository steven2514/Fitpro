<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPro - Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page">
    <header class="site-header">
        <a th:href="@{/}" class="brand"><span class="brand-mark">F</span>FitPro</a>
        <nav>
            <a th:href="@{/registro}" class="btn btn-dark">Registrarme</a>
        </nav>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <span class="eyebrow">Bienvenido de nuevo</span>
            <h1>Iniciar sesión</h1>
            <p class="lead">Entra para ver tu plan, tus clases y tu progreso.</p>

            <div th:if="${param.error}" class="alert alert-error">Usuario o contraseña incorrectos</div>
            <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada correctamente</div>
            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Email o documento</label>
                    <input type="text" id="username" name="username" placeholder="tucorreo@ejemplo.com"
                        autocomplete="username" required autofocus>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Contraseña</label>
                        <a th:href="@{/recuperar}" class="link-small">¿La olvidaste?</a>
                    </div>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña"
                        autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">Entrar</button>
            </form>

            <p class="auth-footer">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a></p>
        </div>
    </main>
</body>

</html>
