<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Editar plan alimenticio')}"></head>

<body class="centered">
    <div class="container">
        <a th:href="@{/admin/alimentacion}" class="back-link">← Volver a alimentación</a>
        <h2>Editar comida del plan</h2>

        <form th:action="@{/admin/alimentacion/editar/{id}(id=${alimentacion.idAlimentacion})}" method="post"
            th:object="${alimentacion}">
            <div class="form-group">
                <label for="idCliente">Cliente *</label>
                <select id="idCliente" name="idCliente" required>
                    <option value="">Seleccione un cliente</option>
                    <option th:each="c : ${clientes}" th:value="${c.idCliente}"
                        th:selected="${alimentacion.cliente != null and c.idCliente == alimentacion.cliente.idCliente}"
                        th:text="${c.nombre + ' ' + c.apellido}">
                    </option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tipoComida">Tipo de comida *</label>
                    <select id="tipoComida" th:field="*{tipoComida}" required>
                        <option value="Desayuno">Desayuno</option>
                        <option value="Media Mañana">Media mañana</option>
                        <option value="Almuerzo">Almuerzo</option>
                        <option value="Merienda">Merienda</option>
                        <option value="Cena">Cena</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="calorias">Calorías *</label>
                    <input type="number" id="calorias" th:field="*{calorias}" min="1" required>
                </div>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción *</label>
                <textarea id="descripcion" th:field="*{descripcion}" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Guardar cambios</button>
        </form>
    </div>
</body>

</html>
