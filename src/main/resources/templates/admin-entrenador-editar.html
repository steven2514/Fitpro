<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Editar entrenador')}"></head>

<body class="centered">
    <div class="container container-wide">
        <a th:href="@{/admin/entrenadores}" class="back-link">← Volver a entrenadores</a>
        <h2>Editar entrenador</h2>

        <div th:replace="~{fragments :: alertas}"></div>

        <form th:action="@{/admin/entrenador/editar/{id}(id=${entrenador.idEntrenador})}" method="post"
            th:object="${entrenador}">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre *</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required>
                </div>
                <div class="form-group">
                    <label for="especialidad">Especialidad *</label>
                    <input type="text" id="especialidad" th:field="*{especialidad}" required>
                </div>
            </div>
            <div class="form-group">
                <label for="horario">Disponibilidad</label>
                <input type="text" id="horario" th:field="*{horario}">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" th:field="*{telefono}">
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </form>

        <!-- Acceso al panel del entrenador -->
        <section class="card mt-32">
            <div class="card-header">
                <h3 class="card-title">Acceso al sistema</h3>
                <span class="badge" th:classappend="${entrenador.tieneAcceso} ? 'badge-success' : 'badge-warning'"
                    th:text="${entrenador.tieneAcceso} ? 'Con acceso' : 'Sin acceso'">Sin acceso</span>
            </div>
            <div class="card-body">
                <p class="item-detail mb-20">
                    Con acceso, el entrenador entra con su email para ver sus clases y alumnos y crearles rutinas.
                </p>
                <form th:action="@{/admin/entrenador/{id}/acceso(id=${entrenador.idEntrenador})}" method="post" class="search-box">
                    <div class="form-group">
                        <label for="acceso-password" th:text="${entrenador.tieneAcceso} ? 'Nueva contraseña' : 'Contraseña'">Contraseña</label>
                        <input type="password" id="acceso-password" name="password" minlength="8" required
                            placeholder="Mínimo 8 caracteres">
                    </div>
                    <button type="submit" class="btn btn-dark" th:text="${entrenador.tieneAcceso} ? 'Cambiar contraseña' : 'Dar acceso'">Dar acceso</button>
                </form>
                <form th:if="${entrenador.tieneAcceso}" th:action="@{/admin/entrenador/{id}/quitar-acceso(id=${entrenador.idEntrenador})}"
                    method="post" class="mt-20" data-confirm="¿Quitar el acceso de este entrenador?">
                    <button type="submit" class="btn btn-danger btn-sm">Quitar acceso</button>
                </form>
            </div>
        </section>

        <section class="mt-32">
            <h3 class="subsection-title">Sus clases</h3>
            <p th:if="${#lists.isEmpty(clasesEntrenador)}" class="info-note">No tiene clases asignadas.</p>
            <ul class="agenda" th:unless="${#lists.isEmpty(clasesEntrenador)}">
                <li th:each="c : ${clasesEntrenador}">
                    <span class="agenda-time" th:text="${c.diaTexto}">Lunes</span>
                    <div>
                        <strong th:text="${c.nombre}">Clase</strong>
                        <span class="item-detail" th:text="${c.horaTexto}">18:00</span>
                    </div>
                    <span class="badge badge-primary" th:text="${c.inscritos} + ' inscritos'">0</span>
                </li>
            </ul>
        </section>
    </div>
</body>

</html>
