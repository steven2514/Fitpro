<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPro - Editar Rutina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body class="centered">
    <div class="container container-wide">
        <a th:href="@{/admin/rutinas}" class="back-link">← Volver a rutinas</a>
        <h2>Editar Rutina</h2>

        <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" role="alert" th:text="${error}"></div>

        <form th:action="@{/admin/rutina/editar/{id}(id=${rutina.idRutina})}" method="post" th:object="${rutina}">
            <div class="form-row">
                <div class="form-group">
                    <label for="idCliente">Cliente *</label>
                    <select id="idCliente" name="idCliente" required>
                        <option value="">Seleccione un cliente</option>
                        <option th:each="cliente : ${clientes}" th:value="${cliente.idCliente}"
                            th:selected="${rutina.cliente != null and cliente.idCliente == rutina.cliente.idCliente}"
                            th:text="${cliente.nombre + ' ' + cliente.apellido}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nivel">Nivel *</label>
                    <select id="nivel" th:field="*{nivel}" required>
                        <option value="Básico">Básico</option>
                        <option value="Intermedio">Intermedio</option>
                        <option value="Avanzado">Avanzado</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre *</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required>
                </div>
                <div class="form-group">
                    <label for="objetivo">Objetivo *</label>
                    <input type="text" id="objetivo" th:field="*{objetivo}" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </form>

        <!-- ==========================================
             EJERCICIOS DE LA RUTINA
        ========================================== -->
        <section id="ejercicios" class="mt-32">
            <div class="flex-between mb-20">
                <h3 class="subsection-title">Ejercicios</h3>
                <span class="badge-count" th:text="${#lists.size(ejercicios)} + ' ejercicios'">0</span>
            </div>

            <div th:if="${#lists.isEmpty(ejercicios)}" class="alert alert-info">
                Esta rutina aún no tiene ejercicios. Agrega el primero abajo.
            </div>

            <div class="table-wrap" th:unless="${#lists.isEmpty(ejercicios)}">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Ejercicio</th>
                            <th>Series × reps</th>
                            <th>Descanso</th>
                            <th>Notas</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ej, estado : ${ejercicios}">
                            <td th:text="${estado.count}">1</td>
                            <td><strong th:text="${ej.nombre}">Sentadilla</strong></td>
                            <td th:text="${ej.series + ' × ' + ej.repeticiones}">4 × 10</td>
                            <td th:text="${ej.descansoSegundos != null ? ej.descansoSegundos + ' s' : '-'}">60 s</td>
                            <td th:text="${ej.notas ?: '-'}">-</td>
                            <td>
                                <form th:action="@{/admin/ejercicio/eliminar/{id}(id=${ej.idEjercicio})}" method="post"
                                    class="inline-form" data-confirm="¿Eliminar este ejercicio?">
                                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="card mt-20">
                <div class="card-header">
                    <h4 class="card-title">Agregar ejercicio</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/rutina/{id}/ejercicio(id=${rutina.idRutina})}" method="post"
                        th:object="${ejercicio}">
                        <div class="form-group">
                            <label for="ej-nombre">Nombre *</label>
                            <input type="text" id="ej-nombre" th:field="*{nombre}" placeholder="Ej: Press de banca" required>
                        </div>
                        <div class="grid grid-3">
                            <div class="form-group">
                                <label for="ej-series">Series *</label>
                                <input type="number" id="ej-series" th:field="*{series}" min="1" max="20" placeholder="4" required>
                            </div>
                            <div class="form-group">
                                <label for="ej-reps">Repeticiones *</label>
                                <input type="number" id="ej-reps" th:field="*{repeticiones}" min="1" max="200" placeholder="12" required>
                            </div>
                            <div class="form-group">
                                <label for="ej-descanso">Descanso (segundos)</label>
                                <input type="number" id="ej-descanso" th:field="*{descansoSegundos}" min="0" max="600" placeholder="60">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="ej-notas">Notas</label>
                            <input type="text" id="ej-notas" th:field="*{notas}" placeholder="Ej: Bajar controlado, 3 segundos">
                        </div>
                        <button type="submit" class="btn btn-dark">Agregar ejercicio</button>
                    </form>
                </div>
            </div>
        </section>
    </div>
</body>

</html>
