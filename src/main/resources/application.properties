server.port=${PORT:8082}
spring.application.name=fitpro

# Las credenciales se leen de variables de entorno o del archivo .env (no se sube a git).
# Ver .env.example
spring.config.import=optional:file:.env[.properties]

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitpro_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# 'update' crea/ajusta las tablas a partir de las entidades (cómodo en local).
# En un servidor usa el perfil prod, que pone 'validate' (ver application-prod.properties).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Primer administrador (sólo se crea si la tabla administrador está vacía)
fitpro.admin.email=${ADMIN_EMAIL:}
fitpro.admin.password=${ADMIN_PASSWORD:}

# Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.root=INFO
logging.level.com.proyecto.fitpro=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Protección del login: intentos fallidos seguidos por IP antes de bloquearla, y minutos de bloqueo
fitpro.login.max-intentos=${LOGIN_MAX_INTENTOS:5}
fitpro.login.minutos-bloqueo=${LOGIN_MINUTOS_BLOQUEO:15}
