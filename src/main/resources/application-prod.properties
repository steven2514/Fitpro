# Perfil de producción: activar con SPRING_PROFILES_ACTIVE=prod
# Las tablas deben existir ya (créalas una vez con el perfil normal o con un script):
# 'validate' sólo comprueba que coinciden con las entidades y nunca modifica la base.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# Cookie de sesión sólo por HTTPS y sin acceso desde JavaScript (COOKIE_SEGURA=false si aún no hay HTTPS)
server.servlet.session.cookie.secure=${COOKIE_SEGURA:true}
server.servlet.session.cookie.http-only=true

logging.level.com.proyecto.fitpro=INFO
logging.level.org.springframework.security=WARN

# Los hostings ponen un proxy delante: así se usa la IP real del usuario (bloqueo del login)
# y se sabe que la petición original llegó por HTTPS.
server.forward-headers-strategy=native
